# Pulls new box scores and commits them, so the site stays current without
# you running anything. Runs a few times a day, whenever you push a change to the
# league files (draft, bench, pickups, stat fixes), and on demand from the
# Actions tab. Needs the CBBD_API_KEY repo secret (Settings > Secrets and
# variables > Actions); without it, it falls back to the ESPN source.
# Its own commits don't re-trigger it (GitHub skips pushes made by workflows).
name: Update stats

on:
  schedule:
    # GitHub starts scheduled runs late (hours, at busy times), so run several
    # times a day, off the top of the hour: ~1am, 6am and 11am ET, Nov-Apr
    - cron: "23 6,11,16 * 11-12,1-4 *"
  push:
    branches: [main]
    paths: ["league/**", ".github/workflows/update.yml"]
  workflow_dispatch:

permissions:
  contents: write

# one run at a time; a new push waits for the current run instead of racing it
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats and rebuild
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python tools/update.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data league index.html
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update stats $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
